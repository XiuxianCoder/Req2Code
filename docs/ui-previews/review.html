  const frame = document.getElementById("app");
  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage({
      jsonrpc: "2.0",
      method: "ui/notifications/tool-result",
      params: { _meta: { "req2code/development-review": review }, run_id: review.run_id }
    }, "*");
    if (new URLSearchParams(location.search).get("publish") === "1") {
      window.setTimeout(() => frame.contentDocument.getElementById("approve").click(), 250);
    }
  });
  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow || event.data?.id === undefined) return;
    event.source.postMessage({ jsonrpc: "2.0", id: event.data.id, result: {} }, "*");
  });
