# Req2Code configuration (schema_version=6)
#
# tapd.*        需求源配置 (TAPD)
# message.*     通知配置 (企业微信/钉钉/webhook)
# review.*      审批配置
# engines.*     执行引擎配置 (cursor / claude_code / codex)
# testing.*     测试与覆盖率配置
# project_memory.* 项目理解、增量记忆、镜像缓存与会话复用
# system.*      系统配置 (日志)
#
# token/secret/webhook 等敏感值会在 `config list` 中自动脱敏。
# 不要把真实密钥提交到代码仓库。

schema_version: 6
source: tapd
tapd:
  enabled: true
  base_url: https://api.tapd.cn
  auth_mode: basic
  app_id: REPLACE_ME_TAPD_APP_ID
  app_secret: REPLACE_ME_TAPD_APP_SECRET
  workspace_id: REPLACE_ME_WORKSPACE_ID
  token_endpoint: /tokens/request_token
  latest_endpoint: /stories
  detail_endpoint: /stories
  field_mapping:
    list_path: data
    detail_path: data
    id_field: Story.id
    title_field: Story.name
    description_field: Story.description
    type_field: Story.type
  bug_latest_endpoint: /bugs
  bug_detail_endpoint: /bugs
  bug_field_mapping:
    list_path: data
    detail_path: data
    id_field: Bug.id
    title_field: Bug.title
    description_field: Bug.description
    type_field: Bug.type
  default_item_type: story
  auth_scheme: Bearer
  auth_header_name: Authorization
  timeout_seconds: 20
  retries: 3
  retry_backoff_seconds: 1.0
  rate_limit_qps: 8.0
  error_stats_file: .req2code/tapd_error_stats.yaml
mock:
  enabled: true
git:
  repo_url: ''
  base_branch: test
  target_branch: test
  remote_name: origin
  branch_prefix: req2code
  commit_author: req2code-bot
  commit_email: req2code-bot@localhost
  auto_init_if_missing: false
message:
  provider: dingtalk
  webhook: REPLACE_ME_MESSAGE_WEBHOOK
  reviewer: qa_reviewer
  timeout_seconds: 10
  default_level: warning
  templates:
    normal: '[{level}] {content}'
    warning: '[{level}] {content}'
    critical: '[{level}] {content}

      artifact={artifact}'
engines:
  active: claude_code
  cursor_enabled: true
  claude_code_enabled: true
  codex_enabled: true
  cursor:
    command: cursor-agent -p --force --output-format stream-json {prompt}
    model: ''
    auth_token: ''
    auth_env_var: ''
    prompt_via_stdin: false
    working_dir: .
    timeout_seconds: 1800
    retries: 1
  claude_code:
    command: claude -p --output-format stream-json
    model: ''
    auth_token: ''
    auth_env_var: ANTHROPIC_API_KEY
    prompt_via_stdin: true
    working_dir: .
    timeout_seconds: 1800
    retries: 1
  codex:
    command: codex exec --json --sandbox workspace-write -
    model: ''
    auth_token: ''
    auth_env_var: CODEX_API_KEY
    prompt_via_stdin: true
    working_dir: .
    timeout_seconds: 1800
    retries: 1
testing:
  script_command: python -m pytest -q tests
  unit_command: python -m pytest -q
  min_coverage: 80.0
  max_fix_attempts: 2
  coverage_command: python -m coverage run -m pytest -q && python -m coverage report
review:
  mode: manual
  approvals_file: approvals.yaml
  callback_secret: REPLACE_ME_APPROVAL_CALLBACK_SECRET
  signature_header: X-Req2Code-Signature
  timestamp_header: X-Req2Code-Timestamp
  nonce_header: X-Req2Code-Nonce
  timestamp_tolerance_seconds: 300
  replay_store_file: replay_nonces.yaml
  ip_allowlist:
  - 127.0.0.1
  - ::1
  lint_command: ''
  security_scan_command: ''
  ai_review_enabled: false
  require_human_approval: true
  approval_base_url: http://127.0.0.1:8088
project_memory:
  enabled: true
  max_context_chars: 14000
  generate_candidate: true
  promote_after_approval: true
  use_mirror_cache: true
  resume_engine_sessions: true
system:
  log_level: INFO
  log_file: ''
  state_dir: ~/.req2code
