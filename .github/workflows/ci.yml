name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q req2code tests scripts
      - name: Test
        run: python -m pytest -q
      - uses: actions/setup-node@v7
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"
      - name: Test MCP Apps UI bridges
        if: matrix.python-version == '3.12'
        run: |
          node tests/selector_ui_harness.js
          node tests/launcher_ui_harness.js
          node tests/feishu_analysis_ui_harness.js
      - name: CLI smoke test
        run: |
          req2code --version
          req2code --help
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
