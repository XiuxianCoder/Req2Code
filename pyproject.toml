[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "req2code"
version = "0.10.0"
description = "Current-agent TAPD and Feishu development workflow with human-gated Git publishing"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tapd", "feishu", "lark", "codex", "claude-code", "cursor", "mcp", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "coverage>=7,<8"]

[project.scripts]
req2code = "req2code.main:app"
req2code-mcp = "req2code.mcp_server:main"

[tool.setuptools.packages.find]
include = ["req2code*"]

[tool.setuptools.package-data]
req2code = [
  "resources/skills/req2code-workflow/SKILL.md",
  "resources/skills/req2code-workflow/agents/openai.yaml",
  "resources/work_item_selector.html",
  "resources/development_review.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
